name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_targets: ${{ steps.plan.outputs.has_targets }}
      run_tests: ${{ steps.plan.outputs.run_tests }}
      verify_build: ${{ steps.plan.outputs.verify_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        run: node tools/ci.mjs plan

  test:
    needs: plan
    if: needs.plan.outputs.run_tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          pakku: ${{ matrix.os == 'ubuntu-24.04' && needs.plan.outputs.verify_build == 'true' && 'true' || 'false' }}
      - run: pnpm test
      - if: matrix.os == 'ubuntu-24.04' && needs.plan.outputs.verify_build == 'true'
        run: pnpm verify:build
      - run: node tools/ci.mjs clean

  build:
    needs: plan
    if: needs.plan.outputs.has_targets == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    concurrency:
      group: preview-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build Target
        id: build
        env:
          TARGET_ID: ${{ matrix.target }}
          EXPECTED_COMMIT: ${{ github.sha }}
          CURSEFORGE_API_KEY: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_type == 'branch' && (github.ref_name == github.event.repository.default_branch || github.ref_protected) && secrets.CURSEFORGE_API_KEY || '' }}
        run: |
          if [ -z "$CURSEFORGE_API_KEY" ]; then unset CURSEFORGE_API_KEY; fi
          node tools/ci.mjs build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: preview-${{ matrix.target }}
          path: ${{ steps.build.outputs.output }}/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  required:
    name: Required checks
    if: always()
    needs: [plan, test, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Check planned jobs
        env:
          PLAN: ${{ needs.plan.result }}
          RUN_TESTS: ${{ needs.plan.outputs.run_tests }}
          TEST: ${{ needs.test.result }}
          HAS_TARGETS: ${{ needs.plan.outputs.has_targets }}
          BUILD: ${{ needs.build.result }}
        run: |
          test "$PLAN" = success
          case "$RUN_TESTS:$TEST" in true:success|false:skipped) ;; *) exit 1 ;; esac
          case "$HAS_TARGETS:$BUILD" in true:success|false:skipped) ;; *) exit 1 ;; esac
